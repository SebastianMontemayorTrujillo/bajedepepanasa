<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142028"/>
      <stop offset="50%" stop-color="#243840"/>
      <stop offset="100%" stop-color="#1a2e36"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.8  0 0 0 0 0.75  0 0 0 0.2 0"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <rect width="800" height="500" filter="url(#noise)" opacity="0.45"/>
  <!-- Brighter water return after storm -->
  <path d="M40 278 Q200 248 380 268 T760 252" fill="none" stroke="#7ec8c8" stroke-width="22" opacity="0.75"/>
  <path d="M40 278 Q200 248 380 268 T760 252" fill="none" stroke="#b8ecec" stroke-width="6" opacity="0.85"/>
